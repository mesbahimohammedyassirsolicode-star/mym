<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="workflow-title workflow-desc">
  <title id="workflow-title">AI lead generation and website audit workflow</title>
  <desc id="workflow-desc">A twelve-step n8n workflow: Manual Trigger, Configuration, Lead Retrieval, Website Detection, Duplicate Removal, Website Fetching, Content Cleaning, AI Prompt Construction, Gemini Processing, Output Parsing, Qualification, and Google Sheets Storage.</desc>

  <defs>
    <pattern id="dot-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#f5f5f7" opacity="0.07" />
    </pattern>
    <radialGradient id="glow-clay" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#c66b4e" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#c66b4e" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-ochre" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#d5ad6c" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#d5ad6c" stop-opacity="0" />
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a4f5b" />
    </marker>
    <style>
      .node-title { font-size: 17px; font-weight: 600; fill: #f5f5f7; }
      .node-sub { font-size: 12.5px; font-weight: 400; fill: #9ba0aa; letter-spacing: 0.2px; }
      .node-num { font-size: 12px; font-weight: 700; fill: #c66b4e; letter-spacing: 0.6px; }
      .node-num-ai { fill: #d5ad6c; }
      .connector { fill: none; stroke: #4a4f5b; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#0b0c0f" />
  <rect width="1600" height="1000" fill="url(#dot-grid)" />
  <ellipse cx="1380" cy="90" rx="420" ry="260" fill="url(#glow-clay)" />
  <ellipse cx="880" cy="500" rx="360" ry="220" fill="url(#glow-ochre)" />

  <!-- Header -->
  <rect x="80" y="44" width="58" height="28" rx="8" fill="#c66b4e" fill-opacity="0.12" stroke="#c66b4e" stroke-opacity="0.4" />
  <text x="109" y="63" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#d17a5e" letter-spacing="1.2">n8n</text>
  <text x="154" y="66" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="28" font-weight="600" fill="#f5f5f7" letter-spacing="-0.4">AI Lead Generation &amp; Website Audit</text>
  <text x="80" y="112" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#a9adb6">Prospect research and audit preparation · 12 connected steps</text>

  <!-- Connectors: row 1 -->
  <path class="connector" d="M 380 225 H 450" marker-end="url(#arrow)" />
  <path class="connector" d="M 760 225 H 830" marker-end="url(#arrow)" />
  <path class="connector" d="M 1140 225 H 1210" marker-end="url(#arrow)" />
  <!-- Wrap right to row 2 -->
  <path class="connector" d="M 1520 225 H 1560 V 500 H 1530" marker-end="url(#arrow)" />
  <!-- Connectors: row 2 (right to left) -->
  <path class="connector" d="M 1212 500 H 1148" marker-end="url(#arrow)" />
  <path class="connector" d="M 832 500 H 768" marker-end="url(#arrow)" />
  <path class="connector" d="M 452 500 H 388" marker-end="url(#arrow)" />
  <!-- Wrap left to row 3 -->
  <path class="connector" d="M 80 500 H 40 V 775 H 70" marker-end="url(#arrow)" />
  <!-- Connectors: row 3 -->
  <path class="connector" d="M 380 775 H 450" marker-end="url(#arrow)" />
  <path class="connector" d="M 760 775 H 830" marker-end="url(#arrow)" />
  <path class="connector" d="M 1140 775 H 1210" marker-end="url(#arrow)" />

  <!-- Row 1 -->
  <g>
    <rect x="80" y="170" width="300" height="110" rx="14" fill="#15181f" stroke="#c66b4e" stroke-opacity="0.5" />
    <rect x="100" y="190" width="32" height="22" rx="6" fill="#c66b4e" fill-opacity="0.16" />
    <text x="116" y="205" text-anchor="middle" class="node-num" font-family="Inter, 'Segoe UI', Arial, sans-serif">01</text>
    <text x="100" y="243" class="node-title" font-family="Inter, 'Segoe UI', Arial, sans-serif">Manual Trigger</text>
    <text x="100" y="266" class="node-sub" font-family="Inter, 'Segoe UI', Arial, sans-serif">Start the run on demand</text>
  </g>
  <g>
    <rect x="460" y="170" width="300" height="110" rx="14" fill="#15181f" stroke="#2b2f39" />
    <rect x="480" y="190" width="32" height="22" rx="6" fill="#f5f5f7" fill-opacity="0.06" />
    <text x="496" y="205" text-anchor="middle" class="node-num" font-family="Inter, 'Segoe UI', Arial, sans-serif">02</text>
    <text x="480" y="243" class="node-title" font-family="Inter, 'Segoe UI', Arial, sans-serif">Configuration</text>
    <text x="480" y="266" class="node-sub" font-family="Inter, 'Segoe UI', Arial, sans-serif">Load audit parameters</text>
  </g>
  <g>
    <rect x="840" y="170" width="300" height="110" rx="14" fill="#15181f" stroke="#2b2f39" />
    <rect x="860" y="190" width="32" height="22" rx="6" fill="#f5f5f7" fill-opacity="0.06" />
    <text x="876" y="205" text-anchor="middle" class="node-num" font-family="Inter, 'Segoe UI', Arial, sans-serif">03</text>
    <text x="860" y="243" class="node-title" font-family="Inter, 'Segoe UI', Arial, sans-serif">Lead Retrieval</text>
    <text x="860" y="266" class="node-sub" font-family="Inter, 'Segoe UI', Arial, sans-serif">Read prospect rows</text>
  </g>
  <g>
    <rect x="1220" y="170" width="300" height="110" rx="14" fill="#15181f" stroke="#2b2f39" />
    <rect x="1240" y="190" width="32" height="22" rx="6" fill="#f5f5f7" fill-opacity="0.06" />
    <text x="1256" y="205" text-anchor="middle" class="node-num" font-family="Inter, 'Segoe UI', Arial, sans-serif">04</text>
    <text x="1240" y="243" class="node-title" font-family="Inter, 'Segoe UI', Arial, sans-serif">Website Detection</text>
    <text x="1240" y="266" class="node-sub" font-family="Inter, 'Segoe UI', Arial, sans-serif">Check for a website</text>
  </g>

  <!-- Row 2 -->
  <g>
    <rect x="1220" y="445" width="300" height="110" rx="14" fill="#15181f" stroke="#2b2f39" />
    <rect x="1240" y="465" width="32" height="22" rx="6" fill="#f5f5f7" fill-opacity="0.06" />
    <text x="1256" y="480" text-anchor="middle" class="node-num" font-family="Inter, 'Segoe UI', Arial, sans-serif">05</text>
    <text x="1240" y="518" class="node-title" font-family="Inter, 'Segoe UI', Arial, sans-serif">Duplicate Removal</text>
    <text x="1240" y="541" class="node-sub" font-family="Inter, 'Segoe UI', Arial, sans-serif">Remove repeated leads</text>
  </g>
  <g>
    <rect x="840" y="445" width="300" height="110" rx="14" fill="#15181f" stroke="#2b2f39" />
    <rect x="860" y="465" width="32" height="22" rx="6" fill="#f5f5f7" fill-opacity="0.06" />
    <text x="876" y="480" text-anchor="middle" class="node-num" font-family="Inter, 'Segoe UI', Arial, sans-serif">06</text>
    <text x="860" y="518" class="node-title" font-family="Inter, 'Segoe UI', Arial, sans-serif">Website Fetching</text>
    <text x="860" y="541" class="node-sub" font-family="Inter, 'Segoe UI', Arial, sans-serif">Request site content</text>
  </g>
  <g>
    <rect x="460" y="445" width="300" height="110" rx="14" fill="#15181f" stroke="#2b2f39" />
    <rect x="480" y="465" width="32" height="22" rx="6" fill="#f5f5f7" fill-opacity="0.06" />
    <text x="496" y="480" text-anchor="middle" class="node-num" font-family="Inter, 'Segoe UI', Arial, sans-serif">07</text>
    <text x="480" y="518" class="node-title" font-family="Inter, 'Segoe UI', Arial, sans-serif">Content Cleaning</text>
    <text x="480" y="541" class="node-sub" font-family="Inter, 'Segoe UI', Arial, sans-serif">Strip and normalise text</text>
  </g>
  <g>
    <rect x="80" y="445" width="300" height="110" rx="14" fill="#15181f" stroke="#2b2f39" />
    <rect x="100" y="465" width="32" height="22" rx="6" fill="#f5f5f7" fill-opacity="0.06" />
    <text x="116" y="480" text-anchor="middle" class="node-num" font-family="Inter, 'Segoe UI', Arial, sans-serif">08</text>
    <text x="100" y="518" class="node-title" font-family="Inter, 'Segoe UI', Arial, sans-serif">AI Prompt Construction</text>
    <text x="100" y="541" class="node-sub" font-family="Inter, 'Segoe UI', Arial, sans-serif">Build the audit prompt</text>
  </g>

  <!-- Row 3 -->
  <g>
    <rect x="80" y="720" width="300" height="110" rx="14" fill="#15181f" stroke="#d5ad6c" stroke-opacity="0.5" />
    <rect x="100" y="740" width="32" height="22" rx="6" fill="#d5ad6c" fill-opacity="0.16" />
    <text x="116" y="755" text-anchor="middle" class="node-num node-num-ai" font-family="Inter, 'Segoe UI', Arial, sans-serif">09</text>
    <text x="100" y="793" class="node-title" font-family="Inter, 'Segoe UI', Arial, sans-serif">Gemini Processing</text>
    <text x="100" y="816" class="node-sub" font-family="Inter, 'Segoe UI', Arial, sans-serif">Generate the audit</text>
  </g>
  <g>
    <rect x="460" y="720" width="300" height="110" rx="14" fill="#15181f" stroke="#2b2f39" />
    <rect x="480" y="740" width="32" height="22" rx="6" fill="#f5f5f7" fill-opacity="0.06" />
    <text x="496" y="755" text-anchor="middle" class="node-num" font-family="Inter, 'Segoe UI', Arial, sans-serif">10</text>
    <text x="480" y="793" class="node-title" font-family="Inter, 'Segoe UI', Arial, sans-serif">Output Parsing</text>
    <text x="480" y="816" class="node-sub" font-family="Inter, 'Segoe UI', Arial, sans-serif">Structure the response</text>
  </g>
  <g>
    <rect x="840" y="720" width="300" height="110" rx="14" fill="#15181f" stroke="#2b2f39" />
    <rect x="860" y="740" width="32" height="22" rx="6" fill="#f5f5f7" fill-opacity="0.06" />
    <text x="876" y="755" text-anchor="middle" class="node-num" font-family="Inter, 'Segoe UI', Arial, sans-serif">11</text>
    <text x="860" y="793" class="node-title" font-family="Inter, 'Segoe UI', Arial, sans-serif">Qualification</text>
    <text x="860" y="816" class="node-sub" font-family="Inter, 'Segoe UI', Arial, sans-serif">Keep qualified results</text>
  </g>
  <g>
    <rect x="1220" y="720" width="300" height="110" rx="14" fill="#15181f" stroke="#c66b4e" stroke-opacity="0.5" />
    <rect x="1240" y="740" width="32" height="22" rx="6" fill="#c66b4e" fill-opacity="0.16" />
    <text x="1256" y="755" text-anchor="middle" class="node-num" font-family="Inter, 'Segoe UI', Arial, sans-serif">12</text>
    <text x="1240" y="793" class="node-title" font-family="Inter, 'Segoe UI', Arial, sans-serif">Google Sheets Storage</text>
    <text x="1240" y="816" class="node-sub" font-family="Inter, 'Segoe UI', Arial, sans-serif">Write audit results</text>
  </g>

  <!-- Footer -->
  <line x1="80" y1="868" x2="1520" y2="868" stroke="#f5f5f7" stroke-opacity="0.08" />
  <text x="80" y="906" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#a9adb6">n8n · Google Gemini · Google Sheets</text>
  <text x="1520" y="906" text-anchor="end" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#6f7480" letter-spacing="2.4">AURASOLI / AUTOMATION</text>
</svg>
